<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A native Bun API and web interface" />
    <title>Bun API</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Native Bun stack</p>
      <h1>One runtime.<br />Zero frameworks.</h1>
      <p class="intro">
        This page and its API are served by <code>Bun.serve()</code>. Edit the
        client files while the dev server runs to see HMR in action.
      </p>

      <section aria-labelledby="api-title">
        <div>
          <p class="label">GET</p>
          <h2 id="api-title">/api/hello</h2>
        </div>
        <button id="request" type="button">Send request</button>
        <pre id="result" aria-live="polite">Ready.</pre>
      </section>
    </main>
  </body>
</html>
